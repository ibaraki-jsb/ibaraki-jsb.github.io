  → 担当者は Drive にファイルを置くだけ。このHTMLの更新は不要。
  下の DATA = [...] は、シートが読めなかったときの予備(最終スナップショット)。

<style>
  /* このページは検索バーを画面上部に固定するため、共通ヘッダーの固定を解除する */
  .sitehead{position:static}

  /* 帯はスポ少ロゴの双葉にちなんだ若草色 */
  .pagehead{background:#eaf5e7;border-bottom:1px solid #cfe6ca}
  .pagehead .wrap{padding:18px 16px}
  .pagehead h1{font-size:1.25rem;color:#1e7a35;letter-spacing:.02em}
  .pagehead p{font-size:.85rem;color:#557a55;margin-top:2px}

  .tools{position:sticky;top:0;background:var(--bg);padding-top:10px;z-index:10;
         border-bottom:1px solid var(--line);margin-bottom:2px}
  .search{position:relative;margin-bottom:10px}
  .search input{width:100%;padding:11px 38px 11px 38px;font-size:1rem;border:1px solid var(--line);
                border-radius:999px;background:#fff;outline:none;font-family:inherit}
  .search input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(183,28,28,.10)}
  .search .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:.95rem}
  .search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;
                 color:var(--sub);font-size:1.1rem;cursor:pointer;padding:4px 8px;display:none}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:10px}
  .tabs button{border:1px solid var(--line);background:var(--chip);color:var(--ink);
               padding:6px 13px;border-radius:999px;font-size:.85rem;cursor:pointer;white-space:nowrap;
               font-family:inherit;transition:.15s}
  .tabs button:hover{background:#e8e9eb}
  .tabs button.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
  .tabs button .n{opacity:.65;font-size:.78em;margin-left:.4em}
  .tabs button.on .n{opacity:.85}

  .group{margin-top:22px}
  .group h2{font-size:.95rem;color:var(--red);margin:0 0 6px;font-weight:700;
            letter-spacing:.02em;display:flex;align-items:baseline;gap:.6em}
  .group h2 .n{color:var(--sub);font-size:.8em;font-weight:400}
  .list{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);
        text-decoration:none;color:inherit;transition:background .12s}
  .item:hover{background:var(--hover)}
  .list > .item:last-child, details:last-child .item:last-child{border-bottom:none}
  .kind{flex:0 0 auto;width:34px;height:34px;border-radius:7px;display:flex;align-items:center;
        justify-content:center;font-size:.62rem;font-weight:700;color:#fff;letter-spacing:.02em}
  .k-PDF{background:#d93025} .k-Excel{background:#1e8e3e} .k-Word{background:#1a56b0}
  .k-PowerPoint{background:#d56b1f} .k-画像{background:#7b52ab} .k-ZIP{background:#5f6368}
  .k-その他{background:#8a9099} .k-フォーム{background:#673ab7}
  .body{min-width:0;flex:1}
  .name{font-size:.94rem;font-weight:600;word-break:break-word;line-height:1.5}
  .desc{font-size:.8rem;color:var(--sub);margin-top:1px;word-break:break-word}
  .meta{flex:0 0 auto;text-align:right;font-size:.76rem;color:var(--sub);white-space:nowrap;line-height:1.4}
  .new{display:inline-block;background:var(--red);color:#fff;font-size:.62rem;font-weight:700;
       border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:1px;letter-spacing:.03em}

  details{border-bottom:1px solid var(--line)}
  details:last-child{border-bottom:none}
  summary{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;
          background:var(--fold);list-style:none;user-select:none}
  summary::-webkit-details-marker{display:none}
  summary:hover{background:#eef0f2}
  .tri{flex:0 0 auto;transition:transform .15s;color:var(--sub);font-size:.7rem}
  details[open] .tri{transform:rotate(90deg)}
  .fname{font-size:.92rem;font-weight:700}
  .fcount{color:var(--sub);font-size:.78rem;margin-left:.2em}
  details .item{padding-left:38px;background:#fff}
  details .item:hover{background:var(--hover)}

  .empty{padding:40px 10px;text-align:center;color:var(--sub);font-size:.9rem}
  .stampline{margin:26px 0 0;padding-top:14px;border-top:1px solid var(--line);
             font-size:.78rem;color:var(--sub);text-align:right}

  @media (max-width:560px){
    .meta{display:none}
    .name{font-size:.9rem}
    /* スマホ: タブを折り返さず1段の横スクロールにして、貼り付きヘッダーを低く保つ */
    .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
          scrollbar-width:none;margin:0 -16px;padding:0 16px 10px}
    .tabs::-webkit-scrollbar{display:none}
  }
</style>

const ORDER = ['本部登録','夏季行事','グランドフェスティバル','体力テスト・一斉奉仕活動','母集団研修会',
               '救急救命講習','スタートコーチ養成','優良指導者表彰','新年親睦会','お別れイベント','こども性暴力防止法'];
const NEW_DAYS = 60;

function computeCategories(){
  return ORDER.filter(c => DATA.some(d => d.c === c))
    .concat([...new Set(DATA.map(d => d.c))].filter(c => !ORDER.includes(c)));
}
let categories = computeCategories();

let filter = '*';
// URLの ?cat=分類名 で初期表示タブを指定できる(例: shiryo.html?cat=夏季行事)
{
  const cat = new URLSearchParams(location.search).get('cat');
  if (cat && categories.includes(cat)) { filter = cat; }
}
const qInput = document.getElementById('q');
const clearBtn = document.getElementById('clear');

function toDate(s){ const p = String(s||'').split('/'); return p.length===3 ? new Date(+p[0],+p[1]-1,+p[2]) : null; }
function isNew(s){ const d = toDate(s); if(!d) return false;
  return (Date.now() - d.getTime()) / 86400000 <= NEW_DAYS; }
function esc(s){ return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function buildTabs(){
  const tabs = document.getElementById('tabs');
  const all = [{key:'*', label:'すべて', n:DATA.length}]
    .concat(categories.map(c => ({key:c, label:c, n:DATA.filter(d=>d.c===c).length})));
  tabs.innerHTML = all.map(t =>
    `<button data-key="${esc(t.key)}"${t.key===filter?' class="on"':''}>${esc(t.label)}<span class="n">${t.n}</span></button>`
  ).join('');
  tabs.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    filter = b.dataset.key;
    buildTabs(); render();
  }));
  // 横スクロール時、選択中タブを見える位置に寄せる
  const on = tabs.querySelector('button.on');
  if (on) { on.scrollIntoView({inline:'center', block:'nearest'}); }
}

function itemHtml(d, showPath){
  const badge = d.k === 'PowerPoint' ? 'PPT' : d.k === 'その他' ? 'FILE' : d.k === 'フォーム' ? 'FORM' : d.k;
  const path = showPath ? esc(d.c) + (d.p ? ' &gt; ' + esc(d.p) : '') : '';
  return `
    <a class="item" href="${esc(d.l)}" target="_blank" rel="noopener">
      <span class="kind k-${esc(d.k)}">${esc(badge)}</span>
      <span class="body">
        <span class="name">${esc(d.n)}${isNew(d.u) ? '<span class="new">NEW</span>' : ''}</span>
        ${d.d || path ? `<span class="desc">${[path, esc(d.d)].filter(Boolean).join(' — ')}</span>` : ''}
      </span>
      <span class="meta">${esc(d.u)}${d.s ? '<br>' + esc(d.s) : ''}</span>
    </a>`;
}

function render(){
  const q = qInput.value.trim().toLowerCase();
  clearBtn.style.display = q ? 'block' : 'none';
  const hit = DATA.filter(d =>
    (filter === '*' || d.c === filter) &&
    (!q || (d.n + ' ' + (d.d||'') + ' ' + d.c + ' ' + (d.p||'')).toLowerCase().includes(q)));

  const out = document.getElementById('out');
  if (!hit.length){
    out.innerHTML = '<div class="empty">該当する資料がありません。<br>検索語を変えるか、「すべて」を選んでください。</div>';
    return;
  }

  if (q){
    out.innerHTML = `
      <div class="group">
        <h2>検索結果<span class="n">${hit.length}件</span></h2>
        <div class="list">${hit.map(d => itemHtml(d, true)).join('')}</div>
      </div>`;
    return;
  }

  out.innerHTML = categories.filter(c => hit.some(d => d.c === c)).map(c => {
    const items = hit.filter(d => d.c === c);
    const direct = items.filter(d => !d.p);
    const paths = [...new Set(items.filter(d => d.p).map(d => d.p))];
    const folders = paths.map(p => {
      const inFolder = items.filter(d => d.p === p);
      const hasNew = inFolder.some(d => isNew(d.u));
      return `
        <details>
          <summary><span class="tri">▶</span><span class="fname">📁 ${esc(p)}</span>
            <span class="fcount">${inFolder.length}件</span>${hasNew ? '<span class="new">NEW</span>' : ''}</summary>
          ${inFolder.map(d => itemHtml(d, false)).join('')}
        </details>`;
    });
    return `
      <div class="group">
        <h2>${esc(c)}<span class="n">${items.length}件</span></h2>
        <div class="list">${direct.map(d => itemHtml(d, false)).join('')}${folders.join('')}</div>
      </div>`;
  }).join('');
}

// ページの最終更新日(公開日時から自動。手動メンテ不要)
function pageStamp(){
  const m = new Date(document.lastModified);
  return isNaN(m) ? '' : ' / ページ更新 ' + m.getFullYear() + '/' + (m.getMonth()+1) + '/' + m.getDate();
}
qInput.addEventListener('input', render);
clearBtn.addEventListener('click', () => { qInput.value = ''; render(); qInput.focus(); });
document.getElementById('stamp').textContent = '掲載資料 ' + DATA.length + ' 件' + pageStamp();
buildTabs(); render();

// ---- シート直読み。成功したら最新データに差し替える。失敗時は焼き込みデータのまま動く ----
const SHEET_ID = '1SO0QSusrDojFkDraf4MSGbUrFBch8jAM1ygvX_SlDVo';
let liveMain = null, liveManual = null;

function gviz(sheetName, handler){
  const s = document.createElement('script');
  s.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
          '/gviz/tq?tqx=out:json;responseHandler:' + handler +
          '&headers=1&sheet=' + encodeURIComponent(sheetName);
  s.onerror = function(){ console.warn('シート読込失敗: ' + sheetName); };
  document.head.appendChild(s);
}
function cellText(row, i){
  const c = row.c ? row.c[i] : null;
  if(!c) return '';
  const v = (c.f !== undefined && c.f !== null) ? c.f : c.v;
  return v == null ? '' : String(v);
}
window.onSheetMain = function(res){ liveMain = res; tryApplyLive(); };
window.onSheetManual = function(res){ liveManual = res; tryApplyLive(); };

function tryApplyLive(){
  if(!liveMain || !liveManual) return;
  try{
    const drive = (liveMain.table.rows || []).map(r => ({
      c: cellText(r,0), p: cellText(r,1), n: cellText(r,2), d: cellText(r,3),
      k: cellText(r,4), u: cellText(r,5), s: cellText(r,6), l: cellText(r,7),
      hide: cellText(r,9)
    })).filter(d => d.c && d.n && d.l && !d.hide.trim());
    const manual = (liveManual.table.rows || []).map(r => ({
      c: cellText(r,0), p: '', n: cellText(r,1) || cellText(r,3), d: cellText(r,2),
      k: cellText(r,4) || 'フォーム', u: cellText(r,5), s: '', l: cellText(r,3),
      hide: cellText(r,6)
    })).filter(d => d.c && d.l && !d.hide.trim());

    if(drive.length + manual.length === 0) return;
    DATA = manual.concat(drive);
    const idx = {};
    ORDER.forEach((c,i) => idx[c] = i);
    DATA.sort((a,b) => (idx[a.c] !== undefined ? idx[a.c] : 999) - (idx[b.c] !== undefined ? idx[b.c] : 999));
    categories = computeCategories();
    document.getElementById('stamp').textContent = '掲載資料 ' + DATA.length + ' 件(自動更新)' + pageStamp();
    buildTabs(); render();
  }catch(e){ console.warn('シートデータの解釈に失敗', e); }
}
gviz('資料一覧', 'onSheetMain');
gviz('手動追加', 'onSheetManual');
</script>
