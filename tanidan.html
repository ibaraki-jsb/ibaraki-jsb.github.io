<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>単位団の紹介 | 茨木市スポーツ少年団本部</title>
<!-- ホーム画面追加・ブックマーク用のアイコン(PWA) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#b71c1c">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=4">
<script src="site.js?v=4" defer></script>
<!--
  単位団の紹介ページ。
  データの正本: K:\マイドライブ\04.本部役員名簿\2026年度本部役員名簿.xls の「登録一覧表」シート。
  年度更新や加入・脱退があったら、下の一覧(DATA)を正本に合わせて直す。
  代表者名・電話番号・団員数は個人情報・変動値のため公開ページには載せない。
-->
<style>
  /* 帯: 若草のグラデーション+競技の気配(薄い透かし)+静かな統計 */
  .pagehead{background:linear-gradient(135deg,#eaf5e7 0%,#dff0da 55%,#d2ecd6 100%);
            border-bottom:1px solid #cfe6ca;position:relative;overflow:hidden}
  .pagehead::after{content:"⚾ 🎾 🏐 ⚽ 🥋 🤸";position:absolute;right:-6px;bottom:-14px;
            font-size:3.4rem;letter-spacing:.2em;opacity:.10;pointer-events:none;white-space:nowrap}
  .pagehead .wrap{padding:20px 16px 18px;position:relative}
  .pagehead h1{font-size:1.35rem;color:#1e7a35;letter-spacing:.02em}
  .pagehead p{font-size:.85rem;color:#557a55;margin-top:2px}
  .stats{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .stat{background:rgba(255,255,255,.75);border:1px solid #cfe6ca;border-radius:10px;
        padding:4px 14px;font-size:.72rem;color:#557a55;transition:transform .25s var(--press)}
  .stat:hover{transform:translateY(-2px)}
  .stat b{font-size:1.05rem;color:#1e7a35;margin-right:.15em}

  .sort{margin-top:16px;font-size:.85rem;color:var(--sub);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .sort button{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--chip);color:var(--ink);
               padding:5px 14px;border-radius:999px;font-size:.85rem;cursor:pointer;font-family:inherit;
               transition:transform .2s var(--press),background .15s,border-color .15s,color .15s,box-shadow .2s}
  .sort button:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(30,40,30,.10)}
  .sort button:active{transform:translateY(0) scale(.94);transition-duration:.06s}
  .sort button.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:700;
                  box-shadow:inset 0 2px 4px rgba(0,0,0,.18)}
  /* 競技絞り込みチップ: その競技の色で灯る */
  .catfilter{margin-top:10px}
  .catfilter button{border-color:var(--cc,var(--line));color:var(--cc,var(--ink));background:#fff}
  .catfilter button.on{background:var(--cc,var(--red));border-color:var(--cc,var(--red));color:#fff}

  .group{margin-top:24px}
  .group h2{font-size:.95rem;color:var(--cc,var(--red));margin:0 0 6px;font-weight:700;
            letter-spacing:.02em;display:flex;align-items:baseline;gap:.6em}
  .group h2 .n{color:var(--sub);font-size:.8em;font-weight:400}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  /* 団カード: 競技色の背番号と左帯。hoverでその競技の色に息づく */
  .card{position:relative;overflow:hidden;border:1px solid var(--line);border-left:5px solid var(--cc,#9aa0a5);
        border-radius:10px;background:#fff;padding:12px 14px;
        transition:transform .22s var(--press),box-shadow .22s ease}
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 20px color-mix(in srgb,var(--cc,#888) 22%,transparent)}
  .card:active{transform:translateY(0) scale(.98);transition-duration:.06s}
  .card .head{display:flex;align-items:center;gap:10px}
  .card .no{flex:0 0 auto;font-size:.72rem;font-weight:700;color:var(--cc,var(--sub));
            background:color-mix(in srgb,var(--cc,#888) 12%,#fff);
            border-radius:5px;padding:2px 8px;letter-spacing:.06em;transition:transform .3s var(--press)}
  .card:hover .no{transform:scale(1.12) rotate(-4deg)}
  .card .name{font-size:.92rem;font-weight:600;line-height:1.5;word-break:break-word}
  .card .catchip{margin-left:auto;flex:0 0 auto;font-size:.68rem;font-weight:700;color:#fff;
            background:var(--cc,#9aa0a5);border-radius:999px;padding:2px 9px;white-space:nowrap}
  .card .detail{margin-top:6px;font-size:.8rem;color:var(--sub);line-height:1.7;word-break:break-word}
  .card .detail a{display:inline-block;color:var(--cc,var(--red));text-decoration:none;font-weight:600;
            border:1px solid color-mix(in srgb,var(--cc,#888) 45%,#fff);border-radius:999px;
            padding:1px 10px;margin:2px 4px 0 0;font-size:.76rem;
            transition:transform .2s var(--press),background .15s,color .15s}
  .card .detail a:hover{background:var(--cc,var(--red));color:#fff;transform:translateY(-2px)}
  .card .detail a:active{transform:scale(.94)}
  .note{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);
        font-size:.78rem;color:var(--sub);text-align:right}
</style>
</head>
<body>

<header class="sitehead">
  <div class="in">
    <a class="brand" href="./"><img src="icons/logo.png" alt="スポーツ少年団ロゴ">茨木市スポーツ少年団本部</a>
    <nav>
      <a href="./">ホーム</a>
      <a href="shiryo.html">資料ダウンロード</a>
      <span class="soon">報告・申請<small>(準備中)</small></span>
      <span class="soon">日程・行事<small>(準備中)</small></span>
      <a class="cur" href="tanidan.html">単位団の紹介</a>
    </nav>
  </div>
</header>

<div class="pagehead">
  <div class="wrap">
    <h1>単位団の紹介</h1>
    <p>茨木市スポーツ少年団に登録している単位団の一覧です(2026年度・24団)。<br>
       入団のお問い合わせは、各団の連絡先(記載のある団) まで。</p>
    <div class="stats" id="stats"></div>
  </div>
</div>

<div class="wrap">
  <div class="sort" id="sort-toggle">
    表示順:
    <button data-mode="no" class="on" data-ripple>登録番号順</button>
    <button data-mode="cat" data-ripple>競技別</button>
  </div>
  <div class="sort catfilter" id="cat-filter" hidden></div>
  <div id="out"></div>
  <div class="note">2026年度登録 / <span id="page-updated"></span></div>
</div>

<footer>
  <div class="in">
    茨木市スポーツ少年団本部 総務広報委員会<br>
    お問い合わせ: <a href="mailto:ibaraki.jsb.soumu@gmail.com">ibaraki.jsb.soumu@gmail.com</a>
  </div>
</footer>

<script>
// 正本: 2026年度本部役員名簿.xls「登録一覧表」(2026-08-15転記)。番号=市登録番号末尾3桁
// area(主な活動地域: 学校名など)・link(団のサイト・SNS)・contact(団が公開を了承した連絡先のみ。
// 代表者の個人電話は載せない)は判明した団から追記する。空欄は表示されない
const DATA = [
  {no:'014', name:'沢池レッドナイト', cat:'野球', area:'', link:'', contact:''},
  {no:'015', name:'沢良宣シャークス', cat:'野球', area:'', link:'', contact:''},
  {no:'024', name:'シーパーズ', cat:'野球', area:'', link:'', contact:''},
  {no:'027', name:'東雲', cat:'野球', area:'', link:'', contact:''},
  {no:'028', name:'玉櫛スラッガー', cat:'野球', area:'', link:'', contact:''},
  {no:'029', name:'安威インディアンズ', cat:'野球', area:'', link:'', contact:''},
  {no:'035', name:'中池ファイターズ', cat:'野球', area:'', link:'', contact:''},
  {no:'038', name:'東太田イーグルス', cat:'野球', area:'', link:'', contact:''},
  {no:'040', name:'中条ウイングス', cat:'野球', area:'', link:'', contact:''},
  {no:'042', name:'水真南', cat:'野球', area:'', link:'', contact:''},
  {no:'043', name:'福井サン・ボーイ', cat:'野球', area:'', link:'', contact:''},
  {no:'044', name:'玉島アニマルズ', cat:'野球', area:'', link:'', contact:''},
  {no:'050', name:'郡山フレンズ', cat:'野球', area:'', link:'', contact:''},
  {no:'052', name:'ローズ・18', cat:'野球', area:'', link:'', contact:''},
  {no:'059', name:'茨木プレジャーズ', cat:'野球', area:'', link:'', contact:''},
  {no:'048', name:'耳原剣友会', cat:'剣道', area:'', link:'', contact:''},
  {no:'058', name:'春日誠武会', cat:'剣道', area:'', link:'', contact:''},
  {no:'066', name:'FC茨木ESB', cat:'サッカー', area:'', link:'', contact:''},
  {no:'061', name:'KAISERSジュニアバレーボールクラブ', cat:'バレーボール', area:'', link:'', contact:''},
  {no:'067', name:'玉櫛スポーツバレーボールクラブ', cat:'バレーボール', area:'', link:'', contact:''},
  {no:'063', name:'少林寺拳法茨木中部', cat:'少林寺拳法', area:'', link:'', contact:''},
  {no:'068', name:'少林寺拳法茨木南', cat:'少林寺拳法', area:'', link:'', contact:''},
  {no:'009', name:'茨木体操', cat:'体操', area:'', link:'', contact:''},
  {no:'001', name:'ストーム・アット・ウィンブルドン', cat:'テニス', area:'', link:'', contact:''},
];
// 競技ごとの色(カード左帯・背番号・チップ・絞り込みボタンで一貫して使う)
const CAT_COLORS = {
  '野球':'#1a56b0', '剣道':'#6d4c41', 'サッカー':'#c62828', 'バレーボール':'#d56b1f',
  '少林寺拳法':'#673ab7', '体操':'#2e9e46', 'テニス':'#00838f'
};
function catColor(c){ return CAT_COLORS[c] || '#8a9099'; }

// 競技の並びは「競技別」に切り替えるたびにローテーションし、特定競技が常に先頭にならないようにする
const BASE_ORDER = ['剣道','テニス','少林寺拳法','野球','バレーボール','サッカー','体操'];
let ORDER = BASE_ORDER;
function rotateOrder(){
  const rot = Math.floor(Math.random() * BASE_ORDER.length);
  ORDER = BASE_ORDER.slice(rot).concat(BASE_ORDER.slice(0, rot));
}
rotateOrder();
let sortMode = 'no';   // 'no'=登録番号順(基本) / 'cat'=競技別
let catFilter = '*';   // 競技別のときの絞り込み(*=ALL)
let lastData = DATA;

function esc(s){ return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function cardsHtml(items){
  return '<div class="cards">' + items.map(d => {
        const lines = [];
        if (d.area) { lines.push('活動場所: ' + esc(d.area)); }
        if (d.time) { lines.push('活動日時: ' + esc(d.time)); }
        if (d.contact) { lines.push('連絡先: ' + esc(d.contact)); }
        if (d.desc) { lines.push(esc(d.desc)); }
        const links = [];
        if (d.link) { links.push(['サイト', d.link]); }
        if (d.insta) { links.push(['Instagram', d.insta]); }
        if (d.x) { links.push(['X', d.x]); }
        if (d.other) {
          // ラベルはURLから自動判定
          const label = /facebook\.com/.test(d.other) ? 'Facebook'
            : /threads\./.test(d.other) ? 'Threads' : 'リンク';
          links.push([label, d.other]);
        }
        if (links.length) {
          lines.push(links.map(l =>
            '<a href="' + esc(l[1]) + '" target="_blank" rel="noopener">' + esc(l[0]) + '</a>'
          ).join(''));
        }
        // リンクはピル型(競技色の枠→hoverで反転)。detailの最終行にまとめる
        return '<div class="card" data-ripple style="--cc:' + catColor(d.cat) + '">' +
          '<div class="head"><span class="no">' + esc(d.no) + '</span>' +
          '<span class="name">' + esc(d.name) + '</span>' +
          '<span class="catchip">' + esc(d.cat) + '</span></div>' +
          (lines.length ? '<div class="detail">' + lines.join('<br>') + '</div>' : '') + '</div>';
      }).join('') + '</div>';
}

// 描画後: カードを上から順にふわっと(再絞り込みのたびに小さく息づく)
function staggerCards(){
  document.querySelectorAll('.card').forEach((c, i) => {
    c.classList.add('rise');
    c.style.animationDelay = Math.min(i * 35, 500) + 'ms';
  });
}

function render(data){
  lastData = data;
  const out = document.getElementById('out');
  if (sortMode === 'no') {
    // 登録番号順の一覧(競技はカード右上のチップで示す)
    const items = [...data].sort((a,b) => a.no.localeCompare(b.no, 'ja', {numeric:true}));
    out.innerHTML = '<div class="group">' + cardsHtml(items) + '</div>';
  } else {
    // 競技別(未知の種目も末尾に表示)。絞り込み中はその競技だけ。見出しも競技色で
    let cats = ORDER.filter(c => data.some(d => d.cat === c))
      .concat([...new Set(data.map(d => d.cat))].filter(c => c && !ORDER.includes(c)));
    if (catFilter !== '*') { cats = cats.filter(c => c === catFilter); }
    out.innerHTML = cats.map(cat => {
      const items = data.filter(d => d.cat === cat);
      return '<div class="group" style="--cc:' + catColor(cat) + '"><h2>' + esc(cat) +
        '<span class="n">' + items.length + '団</span></h2>' + cardsHtml(items) + '</div>';
    }).join('');
  }
  document.querySelectorAll('#sort-toggle button').forEach(b => {
    b.classList.toggle('on', b.dataset.mode === sortMode);
  });
  buildCatFilter(data);
  staggerCards();
  renderStats(data);
}

// 帯の統計: 団数・競技数・リンク掲載団数(静かな数字。煽らない)
function renderStats(data){
  const cats = new Set(data.map(d => d.cat).filter(Boolean));
  const linked = data.filter(d => d.link || d.insta || d.x || d.other).length;
  document.getElementById('stats').innerHTML =
    '<span class="stat"><b>' + data.length + '</b>団</span>' +
    '<span class="stat"><b>' + cats.size + '</b>競技</span>' +
    '<span class="stat"><b>' + linked + '</b>団がサイト・SNSを公開</span>';
}

// 競技の絞り込みボタン(競技別のときだけ表示)
function buildCatFilter(data){
  const box = document.getElementById('cat-filter');
  box.hidden = (sortMode !== 'cat');
  if (box.hidden) { return; }
  const cats = ORDER.filter(c => data.some(d => d.cat === c))
    .concat([...new Set(data.map(d => d.cat))].filter(c => c && !ORDER.includes(c)));
  box.innerHTML = [['*','ALL']].concat(cats.map(c => [c, c])).map(([key,label]) =>
    '<button data-cat="' + esc(key) + '" data-ripple' +
    (key === '*' ? '' : ' style="--cc:' + catColor(key) + '"') +
    (key === catFilter ? ' class="on"' : '') + '>' + esc(label) + '</button>'
  ).join('');
  box.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    catFilter = b.dataset.cat; render(lastData);
  }));
}
document.querySelectorAll('#sort-toggle button').forEach(b => {
  b.addEventListener('click', () => {
    sortMode = b.dataset.mode; catFilter = '*';
    if (sortMode === 'cat') { rotateOrder(); }   // 競技別に入るたびに並びを変える
    render(lastData);
  });
});
render(DATA);

// ---- 「単位団」シート直読み(資料一覧・お知らせと同じ仕組み)。読めない間は上の焼き込みを表示 ----
// シート列: 番号|団名|種目|活動場所|活動日時|連絡先|サイト|Instagram|X|その他リンク|紹介文|非表示
// 役員はスプレッドシート「本部サイト資料一覧」の「単位団」シートを直すだけで、このページに反映される
const SHEET_ID = '1SO0QSusrDojFkDraf4MSGbUrFBch8jAM1ygvX_SlDVo';
function cellText(row, i){
  const c = row.c ? row.c[i] : null;
  if(!c) return '';
  const v = (c.f !== undefined && c.f !== null) ? c.f : c.v;
  return v == null ? '' : String(v);
}
window.onTeams = function(res){
  try{
    // シートが無いとき gviz は先頭シートを返すことがあるため、見出しを検査して本物だけ採用する
    const labels = (res.table.cols || []).map(c => String(c.label || '').trim());
    if(labels[0] !== '番号' || labels[1] !== '団名'){ return; }
    const items = (res.table.rows || []).map(r => ({
      // シート上は数値になり先頭ゼロが落ちるため、3桁に揃える
      no: cellText(r,0).replace(/^(\d{1,2})$/, m => m.padStart(3,'0')), name: cellText(r,1), cat: cellText(r,2), area: cellText(r,3),
      time: cellText(r,4), contact: cellText(r,5), link: cellText(r,6), insta: cellText(r,7),
      x: cellText(r,8), other: cellText(r,9), desc: cellText(r,10), hide: cellText(r,11)
    })).filter(d => d.name && !d.hide.trim());
    if(items.length){
      render(items);
      const p = document.querySelector('.pagehead p');
      if(p){ p.innerHTML = p.innerHTML.replace(/24団/, items.length + '団'); }
    }
  }catch(e){ console.warn('単位団シートの読込に失敗', e); }
};
(function(){
  const s = document.createElement('script');
  s.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
          '/gviz/tq?tqx=out:json;responseHandler:onTeams&headers=1&sheet=' +
          encodeURIComponent('単位団');
  document.head.appendChild(s);
})();

// ページの最終更新日(公開日時から自動)
{
  const m = new Date(document.lastModified);
  if (!isNaN(m)) {
    document.getElementById('page-updated').textContent =
      'ページ更新 ' + m.getFullYear() + '/' + (m.getMonth()+1) + '/' + m.getDate();
  }
}
</script>
</body>
</html>
